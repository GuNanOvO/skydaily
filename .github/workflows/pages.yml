name: pages

on:
  repository_dispatch:
    types: [daily-updated, notice-updated, app-released]
  push:
    branches: [main]
    paths: ['src/link-policy.*', 'src/schema/**', 'src/app-release.*', 'src/apk-inspect.mjs', 'scripts/**', 'assets/**', 'history/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publication
  cancel-in-progress: false

env:
  SITE_URL: https://skydaily.nankki.com

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析 App 发布标签
        id: app_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.client_payload.app_release_tag }}
        run: |
          set -eu
          TAG="${RELEASE_TAG:-}"
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::app_released 事件携带的标签无效"
              exit 1
            fi
          else
            TAG=$(gh release list --limit 100 --json tagName,isDraft,publishedAt --jq '[.[] | select(.isDraft == false) | select(.tagName | startswith("app-v"))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet Pillow==11.3.0
      - run: npm ci --silent --no-audit --no-fund
      - run: npm run typecheck
      - uses: android-actions/setup-android@v4
      - name: 安装安装包校验工具
        run: sdkmanager --install "build-tools;37.0.0"
      - name: 暂存 App 发布文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.app_release.outputs.tag }}
        run: |
          set -eu
          ARGS=(--stage "$RUNNER_TEMP/app-release")
          if [ -n "${RELEASE_TAG:-}" ]; then ARGS+=(--tag "$RELEASE_TAG"); fi
          node scripts/prepare-app-release.mjs "${ARGS[@]}"
      - run: npx playwright install --with-deps chromium
      - name: 取回公开归档
        run: |
          set -eu
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch -q origin data
            git worktree add -q data-store FETCH_HEAD
            rm -rf history/daily history/media history/thumbs
            cp -a data-store/history/. history/
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then exit 1; fi
            mkdir data-store
            git -C data-store init -q -b data
          fi
      - name: 下载私有快照并整理公开归档
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          VERSION: ${{ github.event.client_payload.app_release_tag && '' || github.event.client_payload.version }}
        run: |
          set -eu
          VERSION="${VERSION:-}"
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[a-f0-9]{64}$ ]]; then exit 1; fi
          if [ -n "$VERSION" ]; then
            curl --silent --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 90 -H "Authorization: Bearer $ADMIN_SECRET" "$WORKER_URL/admin/snapshot/$VERSION" -o "$RUNNER_TEMP/snapshot.json"
            python3 scripts/prepare-public-history.py --site "$SITE_URL" --snapshot "$RUNNER_TEMP/snapshot.json"
          else
            python3 scripts/prepare-public-history.py --site "$SITE_URL"
          fi
          rm -f "$RUNNER_TEMP/snapshot.json"
          rm -rf data-store/history
          cp -a history data-store/
      - name: 同步公告归档
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -eu
          node scripts/update-notices.mjs --base "$WORKER_URL" --out history/notices.json || echo "::warning::notice archive unavailable"
          if [ -f history/notices.json ]; then
            mkdir -p data-store/history
            cp history/notices.json data-store/history/notices.json
          fi
      - name: 渲染页面与历史记录
        env:
          PUBLISH_HISTORY: '1'
          APP_RELEASE_JSON: ${{ runner.temp }}/app-release/release.json
        run: |
          RECORD=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("history/index.json"));process.stdout.write(x.dates.at(-1).file)')
          node scripts/render-pages.mjs --file "history/$RECORD"
      - name: 合并 App 发布文件
        run: node scripts/prepare-app-release.mjs --stage "$RUNNER_TEMP/app-release" --integrate out
      - name: 生成每日页面预览图
        run: node scripts/capture-preview.mjs
      - name: 生成分享卡
        run: |
          RECORD=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("history/index.json"));process.stdout.write(x.dates.at(-1).file)')
          node scripts/render-share.mjs --file "history/$RECORD"
      - name: 检查最终发布内容
        run: node --experimental-strip-types scripts/validate-publication.mjs --preview
      - name: 保存已校验的公开归档
        run: |
          git -C data-store config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          git -C data-store config user.name 'github-actions[bot]'
          git -C data-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C data-store add history
          if ! git -C data-store diff --cached --quiet; then
            git -C data-store commit -q -m 'data: update rolling journal archive'
            git -C data-store push -q "$(git remote get-url origin)" HEAD:refs/heads/data
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: 发布页面
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 预热边缘缓存
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: node scripts/warm-cache.mjs || echo "::warning::cache warm incomplete"
      - name: 更新仓库 README 预览
        run: |
          set -eu
          git fetch -q origin main
          git worktree add -q readme-store FETCH_HEAD
          node scripts/update-readme.mjs readme-store/README.md
          git -C readme-store config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          git -C readme-store config user.name 'github-actions[bot]'
          git -C readme-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C readme-store add README.md
          if ! git -C readme-store diff --cached --quiet; then
            git -C readme-store commit -q -m 'docs: update daily page preview'
            git -C readme-store push -q "$(git remote get-url origin)" HEAD:refs/heads/main
          fi
      - name: 确认版本发布成功
        if: github.event_name == 'repository_dispatch' && !github.event.client_payload.app_release_tag
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          VERSION: ${{ github.event.client_payload.app_release_tag && '' || github.event.client_payload.version }}
          NOTICE: ${{ github.event.client_payload.notice }}
        run: |
          set -eu
          if [ -n "${NOTICE:-}" ]; then
            curl --silent --fail --max-time 30 -X POST -H "Authorization: Bearer $ADMIN_SECRET" "$WORKER_URL/admin/notice-published/${NOTICE}" > /dev/null
          fi
          if [ -n "${VERSION:-}" ]; then
            curl --silent --fail --max-time 30 -X POST -H "Authorization: Bearer $ADMIN_SECRET" "$WORKER_URL/admin/published/${VERSION}" > /dev/null
          fi
      - name: 清理私有快照
        if: always()
        run: rm -f "$RUNNER_TEMP/snapshot.json"
